# YoutubeWatchr online server. Start: put ADMIN_PASSWORD into .env, then `docker compose up -d`.
# It is reachable at http://<server>:8974 afterwards (for Nginx Proxy Manager: forward port 8974,
# turn on "Websockets Support"). Keys and settings are kept in data/.
services:
  youtubewatchr:
    image: node:22-alpine
    container_name: youtubewatchr
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    env_file: .env
    ports:
      - "8974:8974"
    volumes:
      - .:/app
