<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #0e1015; --panel: #171a21; --line: #2a2f3a; --text: #e8eaf0; --muted: #8a90a0; --accent: #ff0033; }
  body { margin: 0; width: 300px; padding: 16px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 16px; font-weight: 800; }
  h1 img { width: 24px; height: 24px; }
  h1 span { color: var(--accent); }
  .seg { display: flex; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { flex: 1; padding: 7px 6px; border: 0; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  label { display: block; margin: 0 0 10px; color: var(--muted); }
  input { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  input:focus, button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; padding: 8px 10px; border-radius: 6px; background: var(--panel); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.connected i { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .status.wrong-password i, .status.wrong-key i, .status.offline i, .status.no-server i { background: var(--accent); }
  p.hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1><img src="icons/48.png" alt="">Youtube<span>Watchr</span></h1>
  <div class="seg" role="group" aria-label="Send the music to">
    <button type="button" data-mode="server" aria-pressed="true">Server</button>
    <button type="button" data-mode="obs" aria-pressed="false">OBS WebSocket</button>
  </div>
  <div id="server-box">
    <label>Server address<input id="server" type="url" placeholder="https://ytw.example.com" autocomplete="off"></label>
    <label>Key<input id="key" type="password" autocomplete="off" placeholder="From the editor, under Connection"></label>
    <p class="hint">Both are in the YoutubeWatchr editor under Connection. For the server on this computer, use <b>http://127.0.0.1:8974</b> and leave the key empty.</p>
  </div>
  <div id="obs-box" hidden>
    <label>OBS WebSocket port<input id="port" type="number" min="1" max="65535" placeholder="4455"></label>
    <label>Password<input id="password" type="password" autocomplete="off" placeholder="Empty if authentication is off"></label>
    <p class="hint">No server needed. Find both in OBS under Tools → WebSocket Server Settings.</p>
  </div>
  <div class="status" id="status"><i></i><span id="statusText">Open YouTube Music</span></div>
  <p class="hint">Changes are saved right away.</p>
  <script src="popup.js"></script>
</body>
</html>
