<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YT Music Now Playing</title>
<style>
  :root {
    --accent: #ff2d55;
    --accent2: #ff9f0a;
    --text: #fff;
    --muted: rgba(255,255,255,.7);
    --card: rgba(14,14,18,.72);
    --bar1: var(--accent);
    --bar2: var(--accent2);
    --cap: rgba(255,255,255,.85);
    --bar-round: 3;
    --bar-glow: 0;
    --bar-seg: 0;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    color: var(--text);
    padding: 16px;
  }
  #card {
    position: relative;
    display: flex;
    gap: 18px;
    width: 560px;
    padding: 16px;
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 10px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
  }
  body.no-card #card { background: transparent; box-shadow: none; }
  #card.show { opacity: 1; transform: none; }
  #card.paused { opacity: .55; }
  body.hide-paused #card.paused { opacity: 0; transform: translateY(12px); }

  #glow {
    position: absolute; inset: -40%;
    background: radial-gradient(circle at 15% 50%, var(--accent), transparent 45%);
    opacity: .28; filter: blur(30px);
    transition: background 1s;
    pointer-events: none;
  }
  body.no-card #glow { display: none; }

  #art-wrap {
    position: relative; flex: none;
    width: 128px; height: 128px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    background: #222;
  }
  #art-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: opacity .6s;
  }

  #info {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  #label {
    font-size: 11px; font-weight: 700; letter-spacing: .18em;
    color: var(--accent); text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  #label::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  #card.paused #label::before { box-shadow: none; opacity: .5; }

  .marquee { overflow: hidden; white-space: nowrap; }
  .marquee span { display: inline-block; padding-right: 40px; }
  .marquee.scroll span { animation: var(--mq) var(--dur, 10s) linear infinite; } /* keyframes come from fitMarquees() */
  #title { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.25; }
  #artist { font-size: 15px; color: var(--muted); margin-top: 2px; }

  #eq { flex: 1 1 0; height: 0; width: 100%; min-height: 0; margin-top: 6px; display: block; }

  #progress { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  body.no-progress #progress { display: none; }

  /* ---- theme=glass: Apple-style liquid glass ------------------------------
     OBS browser sources can't see the scene behind them, so backdrop-filter
     would blur nothing. The "glass" is the cover itself, heavily blurred and
     saturated, under a bright specular rim. */
  #frost {
    /* every theme: a blurred copy of the cover tints the card */
    position: absolute; inset: -30px;
    background-size: cover; background-position: center;
    filter: blur(34px) saturate(1.9) brightness(.85);
    opacity: var(--frost, .3); transition: background-image .8s;
    pointer-events: none;
  }
  body.no-card #frost { display: none; }
  body.glass {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --bar1: var(--accent);
    --bar2: rgba(255,255,255,.95); /* white tips keep the bars readable on a same-colored tint */
    --cap: rgba(255,255,255,0);
    --bar-round: 99;
    --bar-glow: 10;
  }
  body.glass #card {
    border-radius: 30px;
    padding: 14px 20px 14px 14px;
    background: rgba(255,255,255,.08);
    box-shadow:
      0 18px 50px rgba(0,0,0,.35),
      0 2px 6px rgba(0,0,0,.2),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -1px 0 rgba(255,255,255,.12),
      inset 0 0 22px rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
  }
  body.glass #glow { display: none; }
  body.glass { --frost: .62; }
  body.glass #card::before {
    /* liquid tint + soft top light */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      radial-gradient(120% 70% at 20% -10%, rgba(255,255,255,.35), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%, rgba(0,0,0,.12));
  }
  body.glass #card::after {
    /* specular rim: bright at top-left and bottom-right, clear in between */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.15) 30%, rgba(255,255,255,0) 50%, rgba(255,255,255,.12) 70%, rgba(255,255,255,.6));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  body.glass #art-wrap {
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 .5px rgba(255,255,255,.35);
  }
  body.glass #label {
    font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: none;
    color: rgba(255,255,255,.75);
  }
  body.glass #label::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  body.glass #title { font-size: 21px; font-weight: 650; letter-spacing: -.01em; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  body.glass #artist { color: rgba(255,255,255,.72); font-weight: 500; }
  body.glass #bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); }
  body.glass #fill { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px var(--accent); border-radius: 3px; }
  body.glass #progress { color: rgba(255,255,255,.7); }

  /* ---- theme=vinyl: a spinning record --------------------------------------
     The cover is the record's center label; the record spins at 33 1/3 rpm
     while playing and the tonearm swings onto it. */
  #vinyl, #tonearm { display: none; }
  body.vinyl {
    font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
    --bar1: var(--accent);
    --bar2: var(--accent2);
    --cap: rgba(255,236,200,.85);
    --bar-round: 1;
  }
  body.vinyl #card {
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(38,26,20,.92), rgba(20,14,12,.92));
    box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,220,170,.08);
  }
  body.vinyl #glow { opacity: .18; }
  body.vinyl #art-wrap { width: 150px; overflow: visible; background: none; box-shadow: none; border-radius: 0; }
  body.vinyl #art-wrap img { display: none; }
  body.vinyl #vinyl {
    display: block; position: absolute; top: 0; left: 0; width: 128px; height: 128px; border-radius: 50%; z-index: 1;
    background:
      radial-gradient(circle, transparent 0 31%, rgba(255,255,255,.06) 31.5%, transparent 32.5%),
      repeating-radial-gradient(circle, #141414 0 1.2px, #1d1d1d 1.6px 2.4px),
      #111;
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
    animation: spin 1.8s linear infinite;
  }
  body.vinyl #vinyl::before {
    /* light catching the grooves; counter-rotated so it stays put while the record spins */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.13) 14%, transparent 20% 60%, rgba(255,255,255,.1) 64%, transparent 70%);
    animation: spin 1.8s linear infinite reverse;
  }
  body.vinyl #vlabel {
    position: absolute; inset: 30%; border-radius: 50%;
    background: #b45309 center / cover;
    box-shadow: 0 0 0 2px rgba(0,0,0,.4);
  }
  body.vinyl #vlabel::after { content: ""; position: absolute; inset: 44%; border-radius: 50%; background: #0b0b0b; }
  body.vinyl #card.paused #vinyl, body.vinyl #card.paused #vinyl::before { animation-play-state: paused; }
  body.vinyl #tonearm {
    /* SVG arm; pivot sits just off the record's top-right, needle lands on the grooves */
    display: block; position: absolute; left: 92px; top: -8px; width: 70px; height: 116px; z-index: 3;
    transform-origin: 50px 14px; transform: rotate(0deg);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.55));
    transition: transform .9s cubic-bezier(.3,.7,.2,1);
  }
  body.vinyl #tonearm svg { display: block; }
  body.vinyl #card.paused #tonearm { transform: rotate(-26deg); }
  body.vinyl #label { color: var(--accent); font-family: "Segoe UI", system-ui, sans-serif; }
  body.vinyl #label::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  body.vinyl #title { font-size: 23px; font-style: italic; color: #fff7ed; }
  body.vinyl #artist { color: rgba(255,237,213,.7); }
  body.vinyl #vlabel { background-color: var(--accent); }
  body.vinyl #progress { font-family: "Segoe UI", system-ui, sans-serif; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- theme=retro: hi-fi deck LCD with segmented level meters ------------ */
  body.retro {
    font-family: "VT323", "Consolas", "Courier New", monospace;
    --bar1: var(--accent); --bar2: var(--accent2);
    --frost: .25;
    --cap: #ff4d4d;
    --bar-seg: 2;
  }
  body.retro #card {
    border-radius: 6px; padding: 14px;
    background: linear-gradient(180deg, #2b2d31, #17181b);
    box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px #000;
  }
  body.retro #glow { display: none; }
  body.retro #art-wrap { width: 116px; height: 116px; margin: 6px; border-radius: 2px; box-shadow: 0 0 0 3px #0a0c0b, 0 0 0 4px #3a3d42; }
  body.retro #art-wrap img { filter: contrast(1.15) saturate(.8); }
  body.retro #art-wrap::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  body.retro #info {
    padding: 8px 12px; border-radius: 3px;
    background: radial-gradient(120% 140% at 30% 0%, rgba(20,24,22,.85), rgba(4,6,5,.92) 70%);
    box-shadow: inset 0 0 0 2px #000;
  }
  body.retro #info::after {
    content: ""; position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  body.retro #label { color: var(--accent); font-size: 15px; letter-spacing: .12em; font-weight: 400; }
  body.retro #label::before { width: 8px; height: 8px; border-radius: 0; background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }
  body.retro #title { font-size: 28px; font-weight: 400; margin-top: 0; line-height: 1.05; color: #f4fff8; text-shadow: 0 0 6px var(--accent); text-transform: uppercase; }
  body.retro #artist { font-size: 19px; color: var(--accent2); margin-top: 0; text-transform: uppercase; }
  body.retro #eq { flex: none; height: 40px; }
  body.retro #progress { font-size: 16px; color: var(--accent2); }
  body.retro #bar { height: 6px; border-radius: 0; background: rgba(255,255,255,.08); }
  body.retro #fill { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 6px); }

  /* ---- compact=1: one-line pill, works with every theme -------------------
     Progress shows as a ring around the round cover. */
  body.compact { --cap: rgba(255,255,255,0); }
  body.compact.classic { --bar-round: 1; }
  /* one fixed height for every theme, so the text sits at the same place in all of them */
  body.compact #card { display: inline-flex; width: var(--cw, 460px); height: 60px; box-sizing: border-box; padding: 10px 20px 10px 10px; border-radius: 999px; gap: 12px; align-items: center; }
  body.compact #art-wrap {
    /* progress as a ring filling clockwise around the cover */
    width: 40px; height: 40px; border-radius: 50%; box-shadow: none;
    background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), rgba(255,255,255,.18) 0);
  }
  body.compact #art-wrap img { inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); border-radius: 50%; }
  body.compact.no-progress #art-wrap { background: none; }
  body.compact.no-progress #art-wrap img { inset: 0; width: 100%; height: 100%; }
  body.compact #info { flex-direction: row; align-items: center; gap: 12px; min-width: 0; }
  body.compact #eq { order: -1; flex: none; width: 54px; height: 26px; margin: 0; }
  body.compact #label, body.compact #progress { display: none; }
  /* fixed width: long names scroll inside instead of resizing the pill */
  /* title and artist share one text size (--cfs, set per theme) so they line up */
  body.compact { --cfs: 17px; }
  html body.compact #title, html body.compact #artist { font-size: var(--cfs); line-height: 1.25; margin: 0; } /* html: beats each theme's own sizes */
  /* both start from 0 and grow equally, each up to its own text width: if both
     names are too long they get the same width and both scroll, like the full card */
  body.compact #title { margin: 0; flex: 1 1 0; min-width: 0; max-width: max-content; }
  body.compact #artist { margin: 0; flex: 1 1 0; min-width: 40px; max-width: max-content; }
  body.compact #artist { padding-left: 12px; border-left: 1px solid rgba(255,255,255,.25); }
  body.compact .marquee span { padding-right: 0; }
  body.compact #card::before, body.compact #card::after { border-radius: 999px; }
  /* glass: thinner rim on the pill */
  body.compact.glass #card { padding: 8px 20px 8px 8px; }
  /* vinyl: a small spinning record inside the ring */
  body.compact.vinyl #art-wrap { overflow: hidden; }
  body.compact.vinyl #vinyl { top: 3px; left: 3px; width: 34px; height: 34px; }
  body.compact.vinyl.no-progress #vinyl { top: 0; left: 0; width: 40px; height: 40px; }
  body.compact.vinyl #tonearm { display: none; }
  body.compact.vinyl { --cfs: 18px; }
  /* retro: keep the deck's square edges and LCD strip */
  body.compact.retro #card { border-radius: 6px; padding: 8px; }
  body.compact.retro #art-wrap { margin: 0; box-shadow: none; }
  body.compact.retro #info { padding: 6px 12px; }
  body.compact.retro { --cfs: 20px; }
  body.compact.retro #artist { border-left-color: rgba(255,255,255,.15); }
  body.compact.retro #eq { height: 28px; }

  /* ---- game-inspired themes: brand palettes, no logos ---------------------
     Each sets its own colors (see BRAND in the script); ?accent= overrides. */

  /* theme=lol: hextech gold frame on deep navy, teal magic glow */
  body.lol { --bar-round: 0; --cap: #f0e6d2; --frost: .18; --bar1: #785a28; --bar2: var(--accent); }
  body.lol #card {
    border-radius: 0;
    background: linear-gradient(180deg, rgba(1,10,19,.95), rgba(9,20,40,.94));
    box-shadow: inset 0 0 0 1px #c8aa6e, inset 0 0 0 4px rgba(1,10,19,.9), inset 0 0 0 5px rgba(120,90,40,.8), 0 0 24px rgba(10,200,185,.15);
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  }
  body.lol #glow { display: none; }
  body.lol #art-wrap { border-radius: 0; box-shadow: 0 0 0 1px #c8aa6e, 0 0 0 3px #010a13, 0 0 0 4px #785a28, 0 0 16px rgba(10,200,185,.35); }
  body.lol #label { font-family: "Cinzel", Georgia, serif; color: var(--accent2); letter-spacing: .22em; }
  body.lol #label::before { border-radius: 0; transform: rotate(45deg); background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  body.lol #title { font-family: "Cinzel", Georgia, serif; font-size: 22px; letter-spacing: .04em; color: #f0e6d2; }
  body.lol #artist { color: #a09b8c; }
  body.lol #bar { border-radius: 0; background: #1e2328; box-shadow: inset 0 0 0 1px #463714; }
  body.lol #fill { background: linear-gradient(90deg, #785a28, var(--accent)); }

  /* theme=cs: CS2 in-game HUD. White text on a dark fade, a killfeed-style
     tag with the red "your kill" outline, T gold and CT blue team colors. */
  body.cs {
    font-family: "Rajdhani", "Arial Narrow", "Segoe UI", sans-serif;
    --bar-round: 0; --bar1: rgba(255,255,255,.55); --bar2: #fff; --cap: var(--accent); --frost: 0;
  }
  body.cs #card {
    border-radius: 0; padding: 12px 18px 15px 12px;
    background: linear-gradient(90deg, rgba(0,0,0,.72), rgba(0,0,0,.45) 70%, rgba(0,0,0,.2));
    box-shadow: none;
  }
  body.cs #card::after {
    /* team split along the bottom edge */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; pointer-events: none;
    background: linear-gradient(90deg, var(--accent) 0 50%, var(--accent2) 50% 100%);
  }
  body.cs #glow { display: none; }
  body.cs #art-wrap { border-radius: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  body.cs #label {
    align-self: flex-start; padding: 1px 8px 1px 6px; border-radius: 3px;
    background: rgba(0,0,0,.6); box-shadow: inset 0 0 0 2px #e0302a;
    color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .06em;
  }
  body.cs #label::before { width: 0; height: 0; border-radius: 0; background: none; box-shadow: none;
    border-left: 7px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  body.cs #title { font-size: 30px; font-weight: 700; text-transform: uppercase; line-height: 1.05; margin-top: 6px; text-shadow: 0 1px 2px rgba(0,0,0,.9); }
  body.cs #artist { font-size: 18px; font-weight: 600; color: var(--accent2); text-shadow: 0 1px 2px rgba(0,0,0,.9); }
  body.cs #progress { font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9); }
  body.cs #bar { height: 4px; border-radius: 0; background: rgba(255,255,255,.18); }
  body.cs #fill { background: #fff; }

  /* theme=faceit: the FaceitWatcher overlay layout. Round avatar-style cover
     with an orange ring, bold name with the artist below it, grey uppercase
     label on the right, full-width pill progress bar with values underneath.
     #14161a at 85%, 12px radius, Geist. */
  body.faceit { font-family: "Geist", "Segoe UI", system-ui, sans-serif; --bar-round: 4; --cap: rgba(255,255,255,0); --frost: 0; }
  body.faceit #card {
    display: grid; width: 420px; box-sizing: border-box; padding: 16px;
    grid-template-columns: 56px minmax(0, 1fr) 124px; grid-template-rows: 26px 30px auto;
    column-gap: 14px; row-gap: 0;
    border-radius: 12px; background: rgba(20,22,26,.85); box-shadow: none;
  }
  body.faceit #info { display: contents; }
  body.faceit #glow { display: none; }
  body.faceit #art-wrap { grid-area: 1 / 1 / 3 / 2; width: 56px; height: 56px; border-radius: 50%; box-shadow: 0 0 0 2px var(--accent); }
  body.faceit #title { grid-area: 1 / 2; margin: 0; font-size: 22px; font-weight: 700; line-height: 1.1; align-self: start; margin-top: -5px; }
  body.faceit #artist {
    grid-area: 2 / 2; align-self: center; margin: 0;
    font-size: 17px; font-weight: 700; color: #fff;
  }
  body.faceit #label {
    grid-area: 1 / 3; justify-self: end; margin-top: 2px;
    color: #9aa0a6; font-size: 11px; font-weight: 400; letter-spacing: .05em;
  }
  body.faceit #label::before { display: none; }
  body.faceit #eq { grid-area: 2 / 3; width: 124px; height: 28px; margin: 0; align-self: center; }
  body.faceit #progress {
    grid-area: 3 / 1 / 4 / 4; margin-top: 16px;
    flex-wrap: wrap; justify-content: space-between; gap: 3px 0;
    color: #9aa0a6; font-size: 12px;
  }
  body.faceit #bar { order: -1; flex: 0 0 100%; height: 6px; border-radius: 99px; background: rgba(255,255,255,.15); }
  body.faceit #fill { background: var(--accent); }

  /* theme=truedamage: inspired by the League "Superstar" music screen.
     Record with a neon ring on a dark green diamond-pattern card; the bars
     light up purple to cyan up to the playhead and stay dim after it, over a
     red-to-gold progress line with a round marker. Builds on the vinyl rules. */
  body.truedamage {
    font-family: "Cinzel", Georgia, serif; --frost: 0;
  }
  body.truedamage #card {
    border-radius: 2px;
    background:
      repeating-linear-gradient(45deg, rgba(120,220,180,.035) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(-45deg, rgba(120,220,180,.035) 0 1px, transparent 1px 22px),
      linear-gradient(180deg, rgba(14,48,40,.96), rgba(7,26,22,.96));
    box-shadow: inset 0 0 0 2px #0b1513, inset 0 0 0 3px rgba(90,170,140,.35), 0 10px 30px rgba(0,0,0,.5);
  }
  body.truedamage #glow { display: none; }
  body.truedamage #vinyl { box-shadow: 0 0 0 4px var(--accent), 0 0 0 5px rgba(0,0,0,.6), 0 0 18px var(--accent); }
  body.truedamage #vinyl::after {
    /* grooves in the colored ring like the screenshot's records */
    content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
  }
  body.truedamage #vlabel { inset: 26%; box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 0 4px rgba(255,255,255,.06); }
  body.truedamage #label { font-family: "Cinzel", Georgia, serif; color: #f0e6d2; letter-spacing: .22em; font-size: 12px; }

<body>

      <rect x="51" y="-1" width="13" height="10" rx="2.5" transform="rotate(25 57 4)" fill="#262a31" stroke="#5a616c"/>

      <g transform="translate(13 99) rotate(32)"><rect x="-5" y="-5" width="10" height="12" rx="1.6" fill="#dfe2e7" stroke="#8a9099" stroke-width=".8"/><rect x="-3" y="6" width="6" height="4" rx=".8" fill="#1b1e23"/></g>
      <circle cx="50" cy="14" r="11" fill="#1b1e23" stroke="#4d535d" stroke-width="1.5"/>
      <circle cx="50" cy="14" r="5" fill="url(#arm-metal)"/>

  </div>

<script>
// Options via URL, e.g. http://127.0.0.1:8974/?bars=24&accent=00e5ff&hidePaused=1

  theme: q.get('theme') || 'classic', // classic | glass | vinyl | retro | truedamage | lol | cs | faceit | iracing | f1 ("minimal" = classic + compact)
  compact: q.get('compact') === '1' || q.get('theme') === 'minimal',
  bars: +q.get('bars') || (q.get('compact') === '1' || q.get('theme') === 'minimal' ? 7 : q.get('theme') === 'faceit' ? 12 : 32),
  accent: q.get('accent'),            // fixed hex color; otherwise taken from the cover
  accent2: q.get('accent2'),          // optional second color for gradients

  bgAlpha: q.has('bgAlpha') ? Math.min(1, Math.max(0, +q.get('bgAlpha'))) : .8,
  text: q.get('text'),                // title text color hex
  radius: q.has('radius') ? Math.max(0, +q.get('radius')) : null,
  font: q.get('font'),                // any Google Fonts family name
  label: q.has('label') ? q.get('label') : 'Now Playing',
  showLabel: q.get('showLabel') !== '0',
  album: q.get('album') !== '0',
  cover: q.get('cover') !== '0',
  still: q.get('still') === '1',      // no animations at all
  eq: q.get('eq') !== '0' && q.get('still') !== '1',
  demo: q.get('demo') === '1',        // built-in demo songs, for previews and the editor
  embed: q.get('embed') === '1',      // no connection: the page that embeds the overlay sends the music (for previews on other pages)
  hidePaused: q.get('hidePaused') === '1',
  card: q.get('card') !== '0',        // card=0: no background, just content
  progress: q.get('progress') !== '0',
  scale: Math.min(3, Math.max(.3, +q.get('scale') || 1)), // overall size, 1 = default
  width: +q.get('width') || 0,         // compact pill width in px (default 460)
  server: q.get('server') || '',      // only needed if the overlay is opened as a local file
  obs: q.get('obs') === '1',          // get the music from the browser extension through OBS WebSocket
  port: +q.get('port') || 4455,       // OBS WebSocket port
  pw: q.get('pw') || '',              // OBS WebSocket password
  fonts: q.get('fonts') || '',        // stylesheet with the theme fonts instead of Google Fonts (for previews on other pages)

document.body.classList.add(['glass', 'vinyl', 'retro', 'lol', 'cs', 'faceit', 'truedamage', 'iracing', 'f1'].includes(opt.theme) ? opt.theme : 'classic');
document.body.classList.toggle('compact', opt.compact);
const FONTS = { retro: 'VT323', lol: 'Cinzel:wght@600;700', truedamage: 'Cinzel:wght@600;700', cs: 'Rajdhani:wght@600;700', faceit: 'Geist:wght@400;600;700', iracing: 'Roboto:wght@500;700', f1: 'Titillium+Web:wght@400;700;900' };

  const f = document.createElement('link');
  f.rel = 'stylesheet'; f.href = opt.fonts || `https://fonts.googleapis.com/css2?family=${FONTS[opt.theme]}&display=swap`;
  document.head.appendChild(f);
}
// Game themes use their own palette instead of colors picked from the cover.
const BRAND = { lol: ['#c8aa6e', '#0ac8b9'], cs: ['#e8c269', '#8db4e2'], faceit: ['#ff5500', '#ff5500'], truedamage: ['#2bf0c8', '#b026ff'], iracing: ['#1e6bff', '#22d34b'], f1: ['#e10600', '#ff5a4f'] }[opt.theme];

document.body.classList.toggle('no-progress', !opt.progress);

const hex = v => '#' + String(v).replace('#', '');
function rgba(h, a) {
  const n = parseInt(h.slice(1).replace(/^(.)(.)(.)$/, '$1$1$2$2$3$3'), 16);

if (opt.radius !== null) { bs.setProperty('--custom-radius', opt.radius + 'px'); bc.add('custom-radius'); }

  const f = document.createElement('link');
  f.rel = 'stylesheet'; f.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(opt.font).replace(/%20/g, '+')}:wght@400;600;700&display=swap`;
  document.head.appendChild(f);
  bs.setProperty('--custom-font', `"${opt.font.replace(/"/g, '')}", system-ui, sans-serif`); bc.add('custom-font');
}

bc.toggle('no-cover', !opt.cover);
bc.toggle('no-eq', !opt.eq);
bc.toggle('still', opt.still);
if (opt.accent) {
  // A fixed color also replaces the cover as the source of the card tint.
  setAccent('#' + opt.accent.replace('#', ''), opt.accent2 ? '#' + opt.accent2.replace('#', '') : undefined);
  document.getElementById('frost').style.background = 'radial-gradient(circle at 25% 45%, var(--accent), transparent 75%)';
}

const card = document.getElementById('card');
const $ = id => document.getElementById(id);

// ---- track ----------------------------------------------------------------
let track = null, trackAt = 0, curArt = '', artFront = $('artA'), artBack = $('artB');

function setMarquee(el, text) {
  const span = el.querySelector('span');
  if (span.textContent === text) return false;
  span.textContent = text;
  return true;
}

// Long names scroll at the same speed (px/s), so a long title and a short artist
// don't race each other. The longer one sets the loop length and the shorter one
// waits at its end, so both start again together.
const MQ_SPEED = 30, MQ_PAUSE = 1.5, mqStyle = document.head.appendChild(document.createElement('style'));
function fitMarquees() {
  const els = [$('title'), $('artist')];
  els.forEach(el => el.classList.remove('scroll'));
  if (opt.still) return;
  requestAnimationFrame(() => {
    const dist = els.map(el => {
      const overflow = el.querySelector('span').scrollWidth - el.clientWidth;
      return overflow > 0 ? overflow + 40 : 0;
    });
    const dur = Math.max(...dist.map(d => 2 * MQ_PAUSE + d / MQ_SPEED));
    const pct = t => (t / dur * 100).toFixed(2) + '%';
    mqStyle.textContent = els.map((el, i) => !dist[i] ? '' : `@keyframes mq-${el.id} {
      0%, ${pct(MQ_PAUSE)} { transform: translateX(0); }
      ${pct(MQ_PAUSE + dist[i] / MQ_SPEED)}, 100% { transform: translateX(-${dist[i]}px); }
    }`).join('\n');
    els.forEach((el, i) => {
      if (!dist[i]) return;
      el.style.setProperty('--mq', 'mq-' + el.id);
      el.style.setProperty('--dur', dur + 's');
      el.classList.add('scroll');

}

function setLine(title, artist) {
  const a = setMarquee($('title'), title), b = setMarquee($('artist'), artist);
  if (a || b) fitMarquees();
}

// Compact: fonts sit differently in their line box (VT323, Cinzel, Rajdhani...), so
// a centered line can still look high or low. Shift title and artist so the middle
// of their capital letters lands on the middle of the line.
function centerCompactText() {
  if (!opt.compact) return;
  const c = document.createElement('canvas').getContext('2d');
  for (const id of ['title', 'artist']) {
    const el = $(id), cs = getComputedStyle(el);
    c.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = c.measureText('H');
    const shift = (m.fontBoundingBoxDescent + m.actualBoundingBoxAscent - m.fontBoundingBoxAscent) / 2;
    el.style.position = 'relative';
    el.style.top = shift.toFixed(2) + 'px';
  }
}
document.fonts.ready.then(centerCompactText);
document.fonts.addEventListener('loadingdone', centerCompactText);

function setArt(url) {
  if (!url || url === curArt) return;
  curArt = url;
  const img = artBack;
  img.onload = () => {
    img.style.opacity = 1;
    $('vlabel').style.backgroundImage = `url("${url}")`;
    if (!opt.accent) $('frost').style.backgroundImage = `url("${url}")`;
    artFront.style.opacity = 0;
    [artFront, artBack] = [img, artFront];
    if (!opt.accent && !BRAND) pickAccent(url);
  };
  img.src = url;
}

function onTrack(t) {
  track = t; trackAt = performance.now();
  setLine(t.title || '', [t.artist, opt.album && t.album].filter(Boolean).join(' · '));
  setArt(t.art);
  card.classList.toggle('paused', !t.playing);
  card.classList.add('show');
  $('label').textContent = t.playing ? opt.label : 'Paused';
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ---- accent color from cover ------------------------------------------------
function setAccent(c1, c2) {
  document.documentElement.style.setProperty('--accent', c1);
  document.documentElement.style.setProperty('--accent2', c2 || c1);

function pickAccent(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';

    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, 24, 24);
      const d = g.getImageData(0, 0, 24, 24).data;

      const px = [];
      for (let i = 0; i < d.length; i += 4) {

function rgbToHsl(r, g, b) {

  if (max === min) return [0, 0, l];
  const d = max - min, s = l > .5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

// ---- equalizer --------------------------------------------------------------
const cv = $('eq'), g = cv.getContext('2d');
let target = new Float32Array(opt.bars), level = new Float32Array(opt.bars), peak = new Float32Array(opt.bars);
let lastBands = 0;
// Most songs keep every band at a steady level with small changes on top,
// which leaves the bars hovering at the same height. Each band is compared
// with its own average of the last second and that difference is amplified,
// so hits jump out while the rough shape of the spectrum stays.
const bandAvg = new Float32Array(opt.bars).fill(-1);

function onBands(b) {
  lastBands = performance.now();
  // Resample whatever the userscript sends to our bar count.
  for (let i = 0; i < opt.bars; i++) {
    const a = (i / opt.bars) * b.length, z = ((i + 1) / opt.bars) * b.length;
    let m = 0;
    for (let j = Math.floor(a); j < Math.max(Math.floor(a) + 1, Math.ceil(z)); j++) m = Math.max(m, b[j] || 0);
    const v = m / 255;
    if (bandAvg[i] < 0) bandAvg[i] = v;
    bandAvg[i] += (v - bandAvg[i]) * .04;
    target[i] = Math.max(0, Math.min(1, v * .6 + (v - bandAvg[i]) * 2.6));
  }
}

function simulate(t) {
  // No real spectrum (audio not hooked yet): a plausible-looking fake.
  for (let i = 0; i < opt.bars; i++) {
    const x = i / opt.bars;
    const beat = Math.pow(Math.max(0, Math.sin(t * 7.5)), 6) * (1 - x);
    const v = .35 + .25 * Math.sin(t * 3 + i * .7) * Math.sin(t * 1.3 + i * .23) + .15 * Math.sin(t * 11 + i * 2.1);
    target[i] = Math.max(0, Math.min(1, v * (1 - x * .45) + beat * .5));
  }
}

function draw(now) {
  const dpr = (window.devicePixelRatio || 1) * opt.scale; // keep bars sharp when scaled up
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const playing = track && track.playing;
  if (playing && now - lastBands > 1500) simulate(now / 1000);
  else if (!playing) target.fill(0);

  const styles = getComputedStyle(document.body);
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, styles.getPropertyValue('--bar1'));
  grad.addColorStop(1, styles.getPropertyValue('--bar2'));
  const round = +styles.getPropertyValue('--bar-round') || 0;
  const glow = +styles.getPropertyValue('--bar-glow') || 0;
  const cap = styles.getPropertyValue('--cap');
  const seg = +styles.getPropertyValue('--bar-seg') || 0;
  g.shadowColor = styles.getPropertyValue('--bar1');

  const pct = track && track.duration
    ? Math.min(1, (track.position + (playing ? (now - trackAt) / 1000 : 0)) / track.duration) : 0;
  const gap = Math.min(3, w / opt.bars * .3), bw = (w - gap * (opt.bars - 1)) / opt.bars;
  if (opt.theme === 'truedamage') { drawSuperstar(w, h, bw, gap, pct); }
  else if (opt.theme === 'iracing') { drawShiftLights(w, h, bw, gap); }
  else for (let i = 0; i < opt.bars; i++) {
    // Fast attack, slower release, falling peak caps.
    level[i] += (target[i] - level[i]) * (target[i] > level[i] ? .55 : .18);
    peak[i] = Math.max(level[i], peak[i] - .012);
    const x = i * (bw + gap);
    const bh = Math.max(2, level[i] * (h - 6));
    if (seg) { drawSegments(x, bw, h, level[i], peak[i], seg, cap, styles); continue; }
    g.fillStyle = grad;
    g.shadowBlur = glow;
    g.beginPath(); g.roundRect(x, h - bh, bw, bh, Math.min(round, bw / 2)); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = cap;
    g.fillRect(x, h - 4 - peak[i] * (h - 6), bw, 2);
  }

  if (track && track.duration) {
    let pos = Math.min(track.duration, track.position + (playing ? (now - trackAt) / 1000 : 0));
    if (opt.still) pos = Math.floor(pos);
    $('fill').style.width = (pos / track.duration * 100) + '%';
    document.body.style.setProperty('--p', (pos / track.duration * 100).toFixed(2));
    $('cur').textContent = fmt(pos);
    $('dur').textContent = fmt(track.duration);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// True Damage: bars up to the playhead glow magenta to cyan, the rest stay
// dim, over a red-to-gold progress line with a round marker.
function drawSuperstar(w, h, bw, gap, pct) {
  // compact: no progress line or marker, the lit bars alone show the progress
  const line = opt.compact ? h + 3 : h - 8, top = 2, room = line - top - 4;
  const head = pct * w;
  for (let i = 0; i < opt.bars; i++) {
    level[i] += (target[i] - level[i]) * (target[i] > level[i] ? .55 : .18);
    const x = i * (bw + gap), bh = Math.max(3, level[i] * room), y = line - 3 - bh;
    if (x + bw <= head) {
      const hue = 290 - 95 * Math.min(1, (x / Math.max(1, head)) ** 2); // magenta -> cyan near the playhead
      const gr = g.createLinearGradient(0, y + bh, 0, y);
      gr.addColorStop(0, `hsl(${hue + 20} 90% 45%)`);
      gr.addColorStop(1, `hsl(${hue} 100% 68%)`);
      g.fillStyle = gr; g.shadowColor = `hsl(${hue} 100% 60%)`; g.shadowBlur = 8;
    } else {
      g.fillStyle = 'rgba(70,60,170,.32)'; g.shadowBlur = 0;
    }
    g.fillRect(x, y, bw, bh);
    g.shadowBlur = 0;
  }
  if (opt.compact) return;
  // progress line
  g.fillStyle = 'rgba(60,70,160,.35)'; g.fillRect(0, line, w, 2);
  const lg = g.createLinearGradient(0, 0, Math.max(1, head), 0);
  lg.addColorStop(0, '#ff3b3b'); lg.addColorStop(.6, '#ff7a2a'); lg.addColorStop(1, '#ffc94a');
  g.fillStyle = lg; g.shadowColor = '#ff7a2a'; g.shadowBlur = 6; g.fillRect(0, line - .5, head, 3); g.shadowBlur = 0;
  // marker
  const cx = Math.min(w - 7, Math.max(7, head)), cy = line + .5;
  g.beginPath(); g.arc(cx, cy, 6.5, 0, 7); g.fillStyle = '#10161a'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = '#c8aa6e'; g.stroke();
  g.beginPath(); g.moveTo(cx - 2.8, cy + .2); g.lineTo(cx - .6, cy + 2.3); g.lineTo(cx + 3, cy - 2.2);
  g.strokeStyle = '#e8f6ff'; g.lineWidth = 1.6; g.stroke();
}

// iRacing: the bars as the shift lights of a sim-racing wheel. Columns of
// round LEDs light up green, yellow, red and blue from left to right; when
// the music hits hard the whole lit strip flashes blue like the shift point.
let shiftAvg = 0;
function drawShiftLights(w, h, bw, gap) {
  const step = 5, n = Math.floor(h / step), r = Math.min(bw, step - 1.2) / 2;
  let sum = 0;
  for (let i = 0; i < opt.bars; i++) {
    level[i] += (target[i] - level[i]) * (target[i] > level[i] ? .55 : .18);
    peak[i] = Math.max(level[i], peak[i] - .012);
    sum += level[i];
  }
  const m = sum / opt.bars, shift = m > .15 && m > shiftAvg + .07; // a hit well above the recent average
  shiftAvg += (m - shiftAvg) * .03;
  for (let i = 0; i < opt.bars; i++) {
    const f = i / Math.max(1, opt.bars - 1);
    const color = shift ? '#2b7fff' : f < .4 ? '#22d34b' : f < .7 ? '#ffd400' : f < .9 ? '#ff2a2a' : '#2b7fff';
    const cx = i * (bw + gap) + bw / 2, lit = Math.round(level[i] * n), top = Math.min(n - 1, Math.round(peak[i] * n));
    for (let k = 0; k < n; k++) {
      const on = k < lit || (k === top && top > 0);
      g.globalAlpha = on ? 1 : .13;
      g.fillStyle = color; g.shadowColor = color; g.shadowBlur = on ? 6 : 0;
      g.beginPath(); g.arc(cx, h - k * step - step / 2, r, 0, 7); g.fill();
    }
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
}

// LED-style meter: lit segments go accent, second accent, red with height.
function drawSegments(x, bw, h, lvl, pk, seg, cap, styles) {
  const low = styles.getPropertyValue('--accent'), mid = styles.getPropertyValue('--accent2');
  const step = seg + 2, n = Math.floor(h / step), lit = Math.round(lvl * n), top = Math.min(n - 1, Math.round(pk * n));
  for (let k = 0; k < n; k++) {
    const f = k / n, on = k < lit;
    g.fillStyle = on ? (f > .85 ? '#ff4d4d' : f > .62 ? mid : low) : 'rgba(255,255,255,.06)';
    g.shadowBlur = on ? 6 : 0; g.shadowColor = g.fillStyle;
    g.fillRect(x, h - (k + 1) * step + 2, bw, seg);
  }
  g.shadowBlur = 0;
  if (top > 0) { g.fillStyle = cap; g.fillRect(x, h - (top + 1) * step + 2, bw, seg); }
}

// ---- connection -------------------------------------------------------------
if (opt.demo) startDemo();
else if (opt.embed) {
  // same message shape as the extension's OBS event: { ytw: 1, track } or { ytw: 1, bands }
  addEventListener('message', e => {
    const d = e.data;
    if (!d || d.ytw !== 1) return;
    if (d.track) onTrack(d.track);
    if (d.bands) onBands(d.bands);
  });
}
else if (opt.obs) connectObs();
else {
  // Served at /overlay/<id>: /overlay/<id>/events, otherwise /events
  const live = location.pathname.match(/^\/overlay\/[\w-]+/);
  const es = new EventSource(live && !opt.server ? live[0] + '/events' : (opt.server || '') + '/events');
  es.addEventListener('track', e => onTrack(JSON.parse(e.data)));
  es.addEventListener('bands', e => onBands(JSON.parse(e.data)));
  // Saved options changed: show them right away
  es.addEventListener('settings', e => { if (SAVED && JSON.parse(e.data) !== window.YTW_SAVED) location.reload(); });
}
// The music tab sends the song every second. When that stops (tab or browser
// closed), show the last song as paused instead of playing on forever.
if (!opt.demo && !opt.embed) setInterval(() => {
  if (track && track.playing && performance.now() - trackAt > 5000) onTrack({ ...track, playing: false });
}, 1000);

// No server: the browser extension broadcasts the music as an OBS WebSocket
// custom event (protocol v5), and we listen for it on the same socket.
function connectObs() {
  const sha = async s => btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))));
  let delay = 1000;
  (function open() {
    const ws = new WebSocket('ws://127.0.0.1:' + opt.port);
    ws.onmessage = async e => {
      const m = JSON.parse(e.data);
      if (m.op === 0) { // Hello
        const id = { rpcVersion: 1, eventSubscriptions: 1 }; // 1 = General, which has CustomEvent
        const a = m.d.authentication;
        if (a) id.authentication = await sha(await sha(opt.pw + a.salt) + a.challenge);
        ws.send(JSON.stringify({ op: 1, d: id }));
      } else if (m.op === 2) delay = 1000; // Identified
      else if (m.op === 5 && m.d.eventType === 'CustomEvent') {
        const d = m.d.eventData;
        if (!d || d.ytw !== 1) return;
        if (d.track) onTrack(d.track);
        if (d.bands) onBands(d.bands);
      }
    };
    ws.onclose = e => {
      if (e.code === 4009) console.warn('[YoutubeWatchr] wrong OBS WebSocket password (pw=)');
      setTimeout(open, delay = Math.min(delay * 2, 10000));
    };
  })();
}

// ---- demo mode ---------------------------------------------------------------
// Made-up songs and a fake spectrum, so the overlay can be previewed without
// the userscript. The editor drives it with postMessage('next' | 'toggle').
function startDemo() {
  function cover(c1, c2, shape) {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 256, 256); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    g.globalAlpha = .35; g.fillStyle = '#fff';
    if (shape === 'sun') { g.beginPath(); g.arc(128, 150, 70, 0, 7); g.fill(); g.globalAlpha = .5; g.fillStyle = c2; for (let i = 0; i < 6; i++) g.fillRect(0, 150 + i * 14, 256, 5 + i); }
    if (shape === 'rings') { g.lineWidth = 10; g.strokeStyle = '#fff'; for (let r = 30; r < 160; r += 30) { g.beginPath(); g.arc(128, 128, r, 0, 7); g.stroke(); } }
    if (shape === 'grid') { for (let x = 0; x < 8; x++) for (let y = 0; y < 8; y++) if ((x * 7 + y * 3) % 5 < 2) g.fillRect(x * 32 + 4, y * 32 + 4, 24, 24); }
    if (shape === 'wave') { g.lineWidth = 8; g.strokeStyle = '#fff'; for (let k = 0; k < 5; k++) { g.beginPath(); for (let x = 0; x <= 256; x += 4) g.lineTo(x, 70 + k * 30 + Math.sin(x / 20 + k) * 14); g.stroke(); } }
    return c.toDataURL();
  }
  const tracks = [
    { title: 'Neon Harbor', artist: 'Lumen Drive', album: 'Night Shift', duration: 214, bpm: 118, art: cover('#ff4f8b', '#5b2bff', 'sun') },
    { title: 'Glass Gardens (Extended Mix) feat. Mira Solenne', artist: 'Kaito Aren', album: 'Bloom Cycle', duration: 389, bpm: 124, art: cover('#00d1b2', '#0a3d62', 'rings') },
    { title: 'Paper Planes at Dawn', artist: 'The Quiet Static', album: 'Low Tide', duration: 176, bpm: 92, art: cover('#ffb347', '#d7263d', 'wave') },
    { title: 'Pixel Rain', artist: 'Byte Orchard', album: '8-Bit Weather', duration: 201, bpm: 140, art: cover('#8bc34a', '#1b5e20', 'grid') },
  ];
  let idx = +q.get('demoTrack') || 0, playing = true, pos = 37, last = performance.now();
  const send = () => onTrack({ ...tracks[idx % tracks.length], playing, position: pos, ts: Date.now() });
  const next = () => { idx = (idx + 1) % tracks.length; pos = 0; send(); };
  window.demo = { next, toggle() { playing = !playing; send(); return playing; } };
  addEventListener('message', e => { if (e.data === 'next') next(); if (e.data === 'toggle') window.demo.toggle(); });
  send();
  setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    if (!playing) return;
    pos += dt; if (pos >= tracks[idx % tracks.length].duration) next();
    // kick and bass on the beat, a moving mid melody, hats on the off-beats
    const t = now / 1000, beat = (t * tracks[idx % tracks.length].bpm / 60) % 1, kick = Math.exp(-beat * 9), hat = Math.exp(-((beat + .5) % 1) * 14);
    const bands = [];
    for (let i = 0; i < 32; i++) {
      const x = i / 31;
      const v = .55 * Math.exp(-x * 2.2) + kick * .5 * Math.exp(-x * 6)
        + .3 * Math.exp(-Math.pow((x - .4 - .12 * Math.sin(t * .9)) * 7, 2))
        + hat * .35 * Math.exp(-Math.pow((x - .85) * 6, 2)) + Math.random() * .08;
      bands.push(Math.round(255 * Math.min(1, v)));
    }
    onBands(bands);
  }, 33);
}
</script>
