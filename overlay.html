<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YT Music Now Playing</title>
<style>
  :root {
    --accent: #ff2d55;
    --accent2: #ff9f0a;
    --text: #fff;
    --muted: rgba(255,255,255,.7);
    --card: rgba(14,14,18,.72);
    --bar1: var(--accent);
    --bar2: var(--accent2);
    --cap: rgba(255,255,255,.85);
    --bar-round: 3;
    --bar-glow: 0;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    color: var(--text);
    padding: 16px;
  }
  #card {
    position: relative;
    display: flex;
    gap: 18px;
    width: 560px;
    padding: 16px;
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 10px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
  }
  body.no-card #card { background: transparent; box-shadow: none; }
  #card.show { opacity: 1; transform: none; }
  #card.paused { opacity: .55; }
  body.hide-paused #card.paused { opacity: 0; transform: translateY(12px); }

  #glow {
    position: absolute; inset: -40%;
    background: radial-gradient(circle at 15% 50%, var(--accent), transparent 45%);
    opacity: .28; filter: blur(30px);
    transition: background 1s;
    pointer-events: none;
  }
  body.no-card #glow { display: none; }

  #art-wrap {
    position: relative; flex: none;
    width: 128px; height: 128px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    background: #222;
  }
  #art-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: opacity .6s;
  }

  #info {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  #label {
    font-size: 11px; font-weight: 700; letter-spacing: .18em;
    color: var(--accent); text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  #label::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  #card.paused #label::before { box-shadow: none; opacity: .5; }

  .marquee { overflow: hidden; white-space: nowrap; }
  .marquee span { display: inline-block; padding-right: 40px; }
  .marquee.scroll span { animation: marquee var(--dur, 10s) linear infinite; }
  @keyframes marquee {
    0%, 15% { transform: translateX(0); }
    85%, 100% { transform: translateX(calc(-1 * var(--dist))); }
  }
  #title { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.25; }
  #artist { font-size: 15px; color: var(--muted); margin-top: 2px; }

  #eq { flex: 1 1 0; height: 0; width: 100%; min-height: 0; margin-top: 6px; display: block; }

  #progress { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  body.no-progress #progress { display: none; }

  /* ---- theme=glass: Apple-style liquid glass ------------------------------
     OBS browser sources can't see the scene behind them, so backdrop-filter
     would blur nothing. The "glass" is the cover itself, heavily blurred and
     saturated, under a bright specular rim. */
  #frost { display: none; }
  body.glass {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --bar1: rgba(255,255,255,.4);
    --bar2: rgba(255,255,255,.98);
    --cap: rgba(255,255,255,0);
    --bar-round: 99;
    --bar-glow: 10;
  }
  body.glass #card {
    border-radius: 30px;
    padding: 14px 20px 14px 14px;
    background: rgba(255,255,255,.08);
    box-shadow:
      0 18px 50px rgba(0,0,0,.35),
      0 2px 6px rgba(0,0,0,.2),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -1px 0 rgba(255,255,255,.12),
      inset 0 0 22px rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
  }
  body.glass #glow { display: none; }
  body.glass #frost {
    display: block; position: absolute; inset: -30px;
    background-size: cover; background-position: center;
    filter: blur(34px) saturate(1.9) brightness(.85);
    opacity: .62; transition: background-image .8s;
    pointer-events: none;
  }
  body.glass #card::before {
    /* liquid tint + soft top light */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      radial-gradient(120% 70% at 20% -10%, rgba(255,255,255,.35), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%, rgba(0,0,0,.12));
  }
  body.glass #card::after {
    /* specular rim: bright at top-left and bottom-right, clear in between */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.15) 30%, rgba(255,255,255,0) 50%, rgba(255,255,255,.12) 70%, rgba(255,255,255,.6));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  body.glass #art-wrap {
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 .5px rgba(255,255,255,.35);
  }
  body.glass #label {
    font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: none;
    color: rgba(255,255,255,.75);
  }
  body.glass #label::before { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.9); }
  body.glass #title { font-size: 21px; font-weight: 650; letter-spacing: -.01em; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  body.glass #artist { color: rgba(255,255,255,.72); font-weight: 500; }
  body.glass #bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); }
  body.glass #fill { background: rgba(255,255,255,.95); box-shadow: 0 0 10px rgba(255,255,255,.6); border-radius: 3px; }
  body.glass #progress { color: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="card">
  <div id="frost"></div>
  <div id="glow"></div>
  <div id="art-wrap"><img id="artA" alt=""><img id="artB" alt="" style="opacity:0"></div>
  <div id="info">
    <div id="label">Now Playing</div>
    <div id="title" class="marquee"><span></span></div>
    <div id="artist" class="marquee"><span></span></div>
    <canvas id="eq"></canvas>
    <div id="progress"><span id="cur">0:00</span><div id="bar"><div id="fill"></div></div><span id="dur">0:00</span></div>
  </div>
</div>

<script>
// Options via URL, e.g. http://127.0.0.1:8974/?bars=24&accent=00e5ff&hidePaused=1
const q = new URLSearchParams(location.search);
const opt = {
  theme: q.get('theme') || 'classic', // classic | glass
  bars: +q.get('bars') || 32,
  accent: q.get('accent'),            // fixed hex color; otherwise taken from the cover
  hidePaused: q.get('hidePaused') === '1',
  card: q.get('card') !== '0',        // card=0: no background, just content
  progress: q.get('progress') !== '0',
  server: q.get('server') || '',      // only needed if the overlay is opened as a local file
};
document.body.classList.toggle('glass', opt.theme === 'glass');
document.body.classList.toggle('hide-paused', opt.hidePaused);
document.body.classList.toggle('no-card', !opt.card);
document.body.classList.toggle('no-progress', !opt.progress);
if (opt.accent) setAccent('#' + opt.accent.replace('#', ''));

const card = document.getElementById('card');
const $ = id => document.getElementById(id);

// ---- track ----------------------------------------------------------------
let track = null, trackAt = 0, curArt = '', artFront = $('artA'), artBack = $('artB');

function setMarquee(el, text) {
  const span = el.querySelector('span');
  if (span.textContent === text) return;
  span.textContent = text;
  el.classList.remove('scroll');
  requestAnimationFrame(() => {
    const overflow = span.scrollWidth - el.clientWidth;
    if (overflow > 0) {
      el.style.setProperty('--dist', overflow + 40 + 'px');
      el.style.setProperty('--dur', Math.max(6, overflow / 30 + 4) + 's');
      el.classList.add('scroll');
    }
  });
}

function setArt(url) {
  if (!url || url === curArt) return;
  curArt = url;
  const img = artBack;
  img.onload = () => {
    img.style.opacity = 1;
    $('frost').style.backgroundImage = `url("${url}")`;
    artFront.style.opacity = 0;
    [artFront, artBack] = [img, artFront];
    if (!opt.accent) pickAccent(url);
  };
  img.src = url;
}

function onTrack(t) {
  track = t; trackAt = performance.now();
  setMarquee($('title'), t.title || '');
  setMarquee($('artist'), [t.artist, t.album].filter(Boolean).join(' · '));
  setArt(t.art);
  card.classList.toggle('paused', !t.playing);
  card.classList.add('show');
  $('label').textContent = t.playing ? 'Now Playing' : 'Paused';
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ---- accent color from cover ------------------------------------------------
function setAccent(c1, c2) {
  document.documentElement.style.setProperty('--accent', c1);
  document.documentElement.style.setProperty('--accent2', c2 || c1);
}
function pickAccent(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, 24, 24);
      const d = g.getImageData(0, 0, 24, 24).data;
      // Pick the two most saturated, reasonably bright pixels' hues.
      const px = [];
      for (let i = 0; i < d.length; i += 4) {
        const [h, s, l] = rgbToHsl(d[i], d[i + 1], d[i + 2]);
        if (l > .25 && l < .8) px.push({ h, score: s * (1 - Math.abs(l - .55)) });
      }
      px.sort((a, b) => b.score - a.score);
      if (!px.length || px[0].score < .15) return setAccent('#ff2d55', '#ff9f0a');
      const h1 = px[0].h;
      const h2 = (px.find(p => Math.abs(p.h - h1) > 30) || { h: h1 + 40 }).h;
      setAccent(`hsl(${h1} 90% 60%)`, `hsl(${h2} 90% 60%)`);
    } catch { /* cover not CORS-readable: keep the current color */ }
  };
  img.src = url;
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min, s = l > .5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

// ---- equalizer --------------------------------------------------------------
const cv = $('eq'), g = cv.getContext('2d');
let target = new Float32Array(opt.bars), level = new Float32Array(opt.bars), peak = new Float32Array(opt.bars);
let lastBands = 0;

function onBands(b) {
  lastBands = performance.now();
  // Resample whatever the userscript sends to our bar count.
  for (let i = 0; i < opt.bars; i++) {
    const a = (i / opt.bars) * b.length, z = ((i + 1) / opt.bars) * b.length;
    let m = 0;
    for (let j = Math.floor(a); j < Math.max(Math.floor(a) + 1, Math.ceil(z)); j++) m = Math.max(m, b[j] || 0);
    target[i] = m / 255;
  }
}

function simulate(t) {
  // No real spectrum (audio not hooked yet): a plausible-looking fake.
  for (let i = 0; i < opt.bars; i++) {
    const x = i / opt.bars;
    const beat = Math.pow(Math.max(0, Math.sin(t * 7.5)), 6) * (1 - x);
    const v = .35 + .25 * Math.sin(t * 3 + i * .7) * Math.sin(t * 1.3 + i * .23) + .15 * Math.sin(t * 11 + i * 2.1);
    target[i] = Math.max(0, Math.min(1, v * (1 - x * .45) + beat * .5));
  }
}

function draw(now) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const playing = track && track.playing;
  if (playing && now - lastBands > 1500) simulate(now / 1000);
  else if (!playing) target.fill(0);

  const styles = getComputedStyle(document.body);
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, styles.getPropertyValue('--bar1'));
  grad.addColorStop(1, styles.getPropertyValue('--bar2'));
  const round = +styles.getPropertyValue('--bar-round') || 0;
  const glow = +styles.getPropertyValue('--bar-glow') || 0;
  const cap = styles.getPropertyValue('--cap');
  g.shadowColor = 'rgba(255,255,255,.55)';

  const gap = 3, bw = (w - gap * (opt.bars - 1)) / opt.bars;
  for (let i = 0; i < opt.bars; i++) {
    // Fast attack, slower release, falling peak caps.
    level[i] += (target[i] - level[i]) * (target[i] > level[i] ? .55 : .18);
    peak[i] = Math.max(level[i], peak[i] - .012);
    const x = i * (bw + gap);
    const bh = Math.max(2, level[i] * (h - 6));
    g.fillStyle = grad;
    g.shadowBlur = glow;
    g.beginPath(); g.roundRect(x, h - bh, bw, bh, Math.min(round, bw / 2)); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = cap;
    g.fillRect(x, h - 4 - peak[i] * (h - 6), bw, 2);
  }

  if (track && track.duration) {
    const pos = Math.min(track.duration, track.position + (playing ? (now - trackAt) / 1000 : 0));
    $('fill').style.width = (pos / track.duration * 100) + '%';
    $('cur').textContent = fmt(pos);
    $('dur').textContent = fmt(track.duration);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---- connection -------------------------------------------------------------
const es = new EventSource((opt.server || '') + '/events');
es.addEventListener('track', e => onTrack(JSON.parse(e.data)));
es.addEventListener('bands', e => onBands(JSON.parse(e.data)));
</script>
</body>
</html>
