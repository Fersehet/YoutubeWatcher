<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YT Music Now Playing</title>
<style>
  :root {
    --accent: #ff2d55;
    --accent2: #ff9f0a;
    --text: #fff;
    --muted: rgba(255,255,255,.7);
    --card: rgba(14,14,18,.72);
    --bar1: var(--accent);
    --bar2: var(--accent2);
    --cap: rgba(255,255,255,.85);
    --bar-round: 3;
    --bar-glow: 0;
    --bar-seg: 0;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    color: var(--text);
    padding: 16px;
  }
  #card {
    position: relative;
    display: flex;
    gap: 18px;
    width: 560px;
    padding: 16px;
    border-radius: 18px;
    background: var(--card);
    box-shadow: 0 10px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
  }
  body.no-card #card { background: transparent; box-shadow: none; }
  #card.show { opacity: 1; transform: none; }
  #card.paused { opacity: .55; }
  body.hide-paused #card.paused { opacity: 0; transform: translateY(12px); }

  #glow {
    position: absolute; inset: -40%;
    background: radial-gradient(circle at 15% 50%, var(--accent), transparent 45%);
    opacity: .28; filter: blur(30px);
    transition: background 1s;
    pointer-events: none;
  }
  body.no-card #glow { display: none; }

  #art-wrap {
    position: relative; flex: none;
    width: 128px; height: 128px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    background: #222;
  }
  #art-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: opacity .6s;
  }

  #info {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  #label {
    font-size: 11px; font-weight: 700; letter-spacing: .18em;
    color: var(--accent); text-transform: uppercase;
    display: flex; align-items: center; gap: 6px;
  }
  #label::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  #card.paused #label::before { box-shadow: none; opacity: .5; }

  .marquee { overflow: hidden; white-space: nowrap; }
  .marquee span { display: inline-block; padding-right: 40px; }
  .marquee.scroll span { animation: marquee var(--dur, 10s) linear infinite; }
  @keyframes marquee {
    0%, 15% { transform: translateX(0); }
    85%, 100% { transform: translateX(calc(-1 * var(--dist))); }
  }
  #title { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.25; }
  #artist { font-size: 15px; color: var(--muted); margin-top: 2px; }

  #eq { flex: 1 1 0; height: 0; width: 100%; min-height: 0; margin-top: 6px; display: block; }

  #progress { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  body.no-progress #progress { display: none; }

  /* ---- theme=glass: Apple-style liquid glass ------------------------------
     OBS browser sources can't see the scene behind them, so backdrop-filter
     would blur nothing. The "glass" is the cover itself, heavily blurred and
     saturated, under a bright specular rim. */
  #frost {
    /* every theme: a blurred copy of the cover tints the card */
    position: absolute; inset: -30px;
    background-size: cover; background-position: center;
    filter: blur(34px) saturate(1.9) brightness(.85);
    opacity: var(--frost, .3); transition: background-image .8s;
    pointer-events: none;
  }
  body.no-card #frost { display: none; }
  body.glass {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --bar1: var(--accent);
    --bar2: rgba(255,255,255,.95); /* white tips keep the bars readable on a same-colored tint */
    --cap: rgba(255,255,255,0);
    --bar-round: 99;
    --bar-glow: 10;
  }
  body.glass #card {
    border-radius: 30px;
    padding: 14px 20px 14px 14px;
    background: rgba(255,255,255,.08);
    box-shadow:
      0 18px 50px rgba(0,0,0,.35),
      0 2px 6px rgba(0,0,0,.2),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -1px 0 rgba(255,255,255,.12),
      inset 0 0 22px rgba(255,255,255,.08);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
  }
  body.glass #glow { display: none; }
  body.glass { --frost: .62; }
  body.glass #card::before {
    /* liquid tint + soft top light */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      radial-gradient(120% 70% at 20% -10%, rgba(255,255,255,.35), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 40%, rgba(0,0,0,.12));
  }
  body.glass #card::after {
    /* specular rim: bright at top-left and bottom-right, clear in between */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.15) 30%, rgba(255,255,255,0) 50%, rgba(255,255,255,.12) 70%, rgba(255,255,255,.6));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  body.glass #art-wrap {
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 .5px rgba(255,255,255,.35);
  }
  body.glass #label {
    font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: none;
    color: rgba(255,255,255,.75);
  }
  body.glass #label::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  body.glass #title { font-size: 21px; font-weight: 650; letter-spacing: -.01em; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  body.glass #artist { color: rgba(255,255,255,.72); font-weight: 500; }
  body.glass #bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); }
  body.glass #fill { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px var(--accent); border-radius: 3px; }
  body.glass #progress { color: rgba(255,255,255,.7); }

  /* ---- theme=vinyl: a spinning record --------------------------------------
     The cover is the record's center label; the record spins at 33 1/3 rpm
     while playing and the tonearm swings onto it. */
  #vinyl, #tonearm { display: none; }
  body.vinyl {
    font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
    --bar1: var(--accent);
    --bar2: var(--accent2);
    --cap: rgba(255,236,200,.85);
    --bar-round: 1;
  }
  body.vinyl #card {
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(38,26,20,.92), rgba(20,14,12,.92));
    box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,220,170,.08);
  }
  body.vinyl #glow { opacity: .18; }
  body.vinyl #art-wrap { width: 150px; overflow: visible; background: none; box-shadow: none; border-radius: 0; }
  body.vinyl #art-wrap img { display: none; }
  body.vinyl #vinyl {
    display: block; position: absolute; top: 0; left: 0; width: 128px; height: 128px; border-radius: 50%; z-index: 1;
    background:
      radial-gradient(circle, transparent 0 31%, rgba(255,255,255,.06) 31.5%, transparent 32.5%),
      repeating-radial-gradient(circle, #141414 0 1.2px, #1d1d1d 1.6px 2.4px),
      #111;
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
    animation: spin 1.8s linear infinite;
  }
  body.vinyl #vinyl::before {
    /* light catching the grooves; counter-rotated so it stays put while the record spins */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.13) 14%, transparent 20% 60%, rgba(255,255,255,.1) 64%, transparent 70%);
    animation: spin 1.8s linear infinite reverse;
  }
  body.vinyl #vlabel {
    position: absolute; inset: 30%; border-radius: 50%;
    background: #b45309 center / cover;
    box-shadow: 0 0 0 2px rgba(0,0,0,.4);
  }
  body.vinyl #vlabel::after { content: ""; position: absolute; inset: 44%; border-radius: 50%; background: #0b0b0b; }
  body.vinyl #card.paused #vinyl, body.vinyl #card.paused #vinyl::before { animation-play-state: paused; }
  body.vinyl #tonearm {
    display: block; position: absolute; top: -8px; left: 140px; width: 6px; height: 92px; z-index: 3;
    transform-origin: 3px 6px; transform: rotate(34deg);
    background: linear-gradient(90deg, #9ca3af, #e5e7eb, #9ca3af); border-radius: 3px;
    transition: transform .9s cubic-bezier(.3,.7,.2,1);
  }
  body.vinyl #tonearm::before { content: ""; position: absolute; top: -4px; left: -5px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle, #6b7280 0 3px, #d1d5db 4px); }
  body.vinyl #tonearm::after { content: ""; position: absolute; bottom: -6px; left: -3px; width: 12px; height: 16px; border-radius: 2px; background: #374151; transform: rotate(-20deg); }
  body.vinyl #card.paused #tonearm { transform: rotate(0deg); }
  body.vinyl #label { color: var(--accent); font-family: "Segoe UI", system-ui, sans-serif; }
  body.vinyl #label::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  body.vinyl #title { font-size: 23px; font-style: italic; color: #fff7ed; }
  body.vinyl #artist { color: rgba(255,237,213,.7); }
  body.vinyl #vlabel { background-color: var(--accent); }
  body.vinyl #progress { font-family: "Segoe UI", system-ui, sans-serif; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- theme=retro: hi-fi deck LCD with segmented level meters ------------ */
  body.retro {
    font-family: "VT323", "Consolas", "Courier New", monospace;
    --bar1: var(--accent); --bar2: var(--accent2);
    --frost: .25;
    --cap: #ff4d4d;
    --bar-seg: 2;
  }
  body.retro #card {
    border-radius: 6px; padding: 14px;
    background: linear-gradient(180deg, #2b2d31, #17181b);
    box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px #000;
  }
  body.retro #glow { display: none; }
  body.retro #art-wrap { width: 116px; height: 116px; margin: 6px; border-radius: 2px; box-shadow: 0 0 0 3px #0a0c0b, 0 0 0 4px #3a3d42; }
  body.retro #art-wrap img { filter: contrast(1.15) saturate(.8); }
  body.retro #art-wrap::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  body.retro #info {
    padding: 8px 12px; border-radius: 3px;
    background: radial-gradient(120% 140% at 30% 0%, rgba(20,24,22,.85), rgba(4,6,5,.92) 70%);
    box-shadow: inset 0 0 0 2px #000;
  }
  body.retro #info::after {
    content: ""; position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  }
  body.retro #label { color: var(--accent); font-size: 15px; letter-spacing: .12em; font-weight: 400; }
  body.retro #label::before { width: 8px; height: 8px; border-radius: 0; background: #ff4d4d; box-shadow: 0 0 6px #ff4d4d; }
  body.retro #title { font-size: 28px; font-weight: 400; margin-top: 0; line-height: 1.05; color: #f4fff8; text-shadow: 0 0 6px var(--accent); text-transform: uppercase; }
  body.retro #artist { font-size: 19px; color: var(--accent2); margin-top: 0; text-transform: uppercase; }
  body.retro #eq { flex: none; height: 40px; }
  body.retro #progress { font-size: 16px; color: var(--accent2); }
  body.retro #bar { height: 6px; border-radius: 0; background: rgba(255,255,255,.08); }
  body.retro #fill { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 6px); }

  /* ---- theme=minimal: one-line lower third ------------------------------- */
  body.minimal { --bar-round: 1; --cap: rgba(255,255,255,0); }
  body.minimal #card { display: inline-flex; width: auto; max-width: 588px; padding: 10px 20px 10px 10px; border-radius: 999px; gap: 12px; align-items: center; }
  body.minimal #art-wrap { width: 40px; height: 40px; border-radius: 50%; box-shadow: none; }
  body.minimal #info { flex-direction: row; align-items: center; gap: 12px; }
  body.minimal #eq { order: -1; flex: none; width: 54px; height: 26px; margin: 0; }
  body.minimal #label, body.minimal #progress { display: none; }
  body.minimal #title { font-size: 17px; margin: 0; flex: 0 1 auto; min-width: 0; max-width: 300px; }
  body.minimal #artist { font-size: 15px; margin: 0; flex: 0 1 auto; min-width: 0; max-width: 190px; }
  body.minimal #artist { padding-left: 12px; border-left: 1px solid rgba(255,255,255,.25); }
  body.minimal .marquee span { padding-right: 0; }

  /* ---- card=0 works in every theme: drop the panel, keep the content ------
     Placed last so it wins over each theme's own card rules. */
  body.no-card #card {
    background: transparent; box-shadow: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  body.no-card #card::before, body.no-card #card::after,
  body.no-card #info::after, body.no-card #frost, body.no-card #glow { display: none; }
  body.no-card #info { background: transparent; box-shadow: none; }
  body.no-card #title, body.no-card #artist, body.no-card #label, body.no-card #progress {
    text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="card">
  <div id="frost"></div>
  <div id="glow"></div>
  <div id="art-wrap"><div id="vinyl"><div id="vlabel"></div></div><div id="tonearm"></div><img id="artA" alt=""><img id="artB" alt="" style="opacity:0"></div>
  <div id="info">
    <div id="label">Now Playing</div>
    <div id="title" class="marquee"><span></span></div>
    <div id="artist" class="marquee"><span></span></div>
    <canvas id="eq"></canvas>
    <div id="progress"><span id="cur">0:00</span><div id="bar"><div id="fill"></div></div><span id="dur">0:00</span></div>
  </div>
</div>

<script>
// Options via URL, e.g. http://127.0.0.1:8974/?bars=24&accent=00e5ff&hidePaused=1
const q = new URLSearchParams(location.search);
const opt = {
  theme: q.get('theme') || 'classic', // classic | glass | vinyl | retro | minimal
  bars: +q.get('bars') || (q.get('theme') === 'minimal' ? 7 : 32),
  accent: q.get('accent'),            // fixed hex color; otherwise taken from the cover
  hidePaused: q.get('hidePaused') === '1',
  card: q.get('card') !== '0',        // card=0: no background, just content
  progress: q.get('progress') !== '0',
  server: q.get('server') || '',      // only needed if the overlay is opened as a local file
};
if (['glass', 'vinyl', 'retro', 'minimal'].includes(opt.theme)) document.body.classList.add(opt.theme);
if (opt.theme === 'retro') {
  const f = document.createElement('link');
  f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=VT323&display=swap';
  document.head.appendChild(f);
}
document.body.classList.toggle('hide-paused', opt.hidePaused);
document.body.classList.toggle('no-card', !opt.card);
document.body.classList.toggle('no-progress', !opt.progress);
if (opt.accent) {
  // A fixed color also replaces the cover as the source of the card tint.
  setAccent('#' + opt.accent.replace('#', ''));
  document.getElementById('frost').style.background = 'radial-gradient(circle at 25% 45%, var(--accent), transparent 75%)';
}

const card = document.getElementById('card');
const $ = id => document.getElementById(id);

// ---- track ----------------------------------------------------------------
let track = null, trackAt = 0, curArt = '', artFront = $('artA'), artBack = $('artB');

function setMarquee(el, text) {
  const span = el.querySelector('span');
  if (span.textContent === text) return;
  span.textContent = text;
  el.classList.remove('scroll');
  requestAnimationFrame(() => {
    const overflow = span.scrollWidth - el.clientWidth;
    if (overflow > 0) {
      el.style.setProperty('--dist', overflow + 40 + 'px');
      el.style.setProperty('--dur', Math.max(6, overflow / 30 + 4) + 's');
      el.classList.add('scroll');
    }
  });
}

function setArt(url) {
  if (!url || url === curArt) return;
  curArt = url;
  const img = artBack;
  img.onload = () => {
    img.style.opacity = 1;
    $('vlabel').style.backgroundImage = `url("${url}")`;
    if (!opt.accent) $('frost').style.backgroundImage = `url("${url}")`;
    artFront.style.opacity = 0;
    [artFront, artBack] = [img, artFront];
    if (!opt.accent) pickAccent(url);
  };
  img.src = url;
}

function onTrack(t) {
  track = t; trackAt = performance.now();
  setMarquee($('title'), t.title || '');
  setMarquee($('artist'), [t.artist, t.album].filter(Boolean).join(' · '));
  setArt(t.art);
  card.classList.toggle('paused', !t.playing);
  card.classList.add('show');
  $('label').textContent = t.playing ? 'Now Playing' : 'Paused';
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ---- accent color from cover ------------------------------------------------
function setAccent(c1, c2) {
  document.documentElement.style.setProperty('--accent', c1);
  document.documentElement.style.setProperty('--accent2', c2 || c1);
}
function pickAccent(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 24;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, 24, 24);
      const d = g.getImageData(0, 0, 24, 24).data;
      // Pick the two most saturated, reasonably bright pixels' hues.
      const px = [];
      for (let i = 0; i < d.length; i += 4) {
        const [h, s, l] = rgbToHsl(d[i], d[i + 1], d[i + 2]);
        if (l > .25 && l < .8) px.push({ h, score: s * (1 - Math.abs(l - .55)) });
      }
      px.sort((a, b) => b.score - a.score);
      if (!px.length || px[0].score < .15) return setAccent('#ff2d55', '#ff9f0a');
      const h1 = px[0].h;
      const h2 = (px.find(p => Math.abs(p.h - h1) > 30) || { h: h1 + 40 }).h;
      setAccent(`hsl(${h1} 90% 60%)`, `hsl(${h2} 90% 60%)`);
    } catch { /* cover not CORS-readable: keep the current color */ }
  };
  img.src = url;
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min, s = l > .5 ? d / (2 - max - min) : d / (max + min);
  let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

// ---- equalizer --------------------------------------------------------------
const cv = $('eq'), g = cv.getContext('2d');
let target = new Float32Array(opt.bars), level = new Float32Array(opt.bars), peak = new Float32Array(opt.bars);
let lastBands = 0;

function onBands(b) {
  lastBands = performance.now();
  // Resample whatever the userscript sends to our bar count.
  for (let i = 0; i < opt.bars; i++) {
    const a = (i / opt.bars) * b.length, z = ((i + 1) / opt.bars) * b.length;
    let m = 0;
    for (let j = Math.floor(a); j < Math.max(Math.floor(a) + 1, Math.ceil(z)); j++) m = Math.max(m, b[j] || 0);
    target[i] = m / 255;
  }
}

function simulate(t) {
  // No real spectrum (audio not hooked yet): a plausible-looking fake.
  for (let i = 0; i < opt.bars; i++) {
    const x = i / opt.bars;
    const beat = Math.pow(Math.max(0, Math.sin(t * 7.5)), 6) * (1 - x);
    const v = .35 + .25 * Math.sin(t * 3 + i * .7) * Math.sin(t * 1.3 + i * .23) + .15 * Math.sin(t * 11 + i * 2.1);
    target[i] = Math.max(0, Math.min(1, v * (1 - x * .45) + beat * .5));
  }
}

function draw(now) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const playing = track && track.playing;
  if (playing && now - lastBands > 1500) simulate(now / 1000);
  else if (!playing) target.fill(0);

  const styles = getComputedStyle(document.body);
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, styles.getPropertyValue('--bar1'));
  grad.addColorStop(1, styles.getPropertyValue('--bar2'));
  const round = +styles.getPropertyValue('--bar-round') || 0;
  const glow = +styles.getPropertyValue('--bar-glow') || 0;
  const cap = styles.getPropertyValue('--cap');
  const seg = +styles.getPropertyValue('--bar-seg') || 0;
  g.shadowColor = styles.getPropertyValue('--bar1');

  const gap = Math.min(3, w / opt.bars * .3), bw = (w - gap * (opt.bars - 1)) / opt.bars;
  for (let i = 0; i < opt.bars; i++) {
    // Fast attack, slower release, falling peak caps.
    level[i] += (target[i] - level[i]) * (target[i] > level[i] ? .55 : .18);
    peak[i] = Math.max(level[i], peak[i] - .012);
    const x = i * (bw + gap);
    const bh = Math.max(2, level[i] * (h - 6));
    if (seg) { drawSegments(x, bw, h, level[i], peak[i], seg, cap, styles); continue; }
    g.fillStyle = grad;
    g.shadowBlur = glow;
    g.beginPath(); g.roundRect(x, h - bh, bw, bh, Math.min(round, bw / 2)); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = cap;
    g.fillRect(x, h - 4 - peak[i] * (h - 6), bw, 2);
  }

  if (track && track.duration) {
    const pos = Math.min(track.duration, track.position + (playing ? (now - trackAt) / 1000 : 0));
    $('fill').style.width = (pos / track.duration * 100) + '%';
    $('cur').textContent = fmt(pos);
    $('dur').textContent = fmt(track.duration);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// LED-style meter: lit segments go accent, second accent, red with height.
function drawSegments(x, bw, h, lvl, pk, seg, cap, styles) {
  const low = styles.getPropertyValue('--accent'), mid = styles.getPropertyValue('--accent2');
  const step = seg + 2, n = Math.floor(h / step), lit = Math.round(lvl * n), top = Math.min(n - 1, Math.round(pk * n));
  for (let k = 0; k < n; k++) {
    const f = k / n, on = k < lit;
    g.fillStyle = on ? (f > .85 ? '#ff4d4d' : f > .62 ? mid : low) : 'rgba(255,255,255,.06)';
    g.shadowBlur = on ? 6 : 0; g.shadowColor = g.fillStyle;
    g.fillRect(x, h - (k + 1) * step + 2, bw, seg);
  }
  g.shadowBlur = 0;
  if (top > 0) { g.fillStyle = cap; g.fillRect(x, h - (top + 1) * step + 2, bw, seg); }
}

// ---- connection -------------------------------------------------------------
const es = new EventSource((opt.server || '') + '/events');
es.addEventListener('track', e => onTrack(JSON.parse(e.data)));
es.addEventListener('bands', e => onBands(JSON.parse(e.data)));
</script>
