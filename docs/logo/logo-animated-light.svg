<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 372 72" width="372" height="72">
  <title>YoutubeWatcher</title>
  <style>
    /* Same choreography as FaceitWatcher's animated logo: the sign builds up,
       the white shape draws in, the name rises; then the bars keep bouncing. */
    .bar { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scaleY(.4); animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) forwards, eq .8s ease-in-out infinite alternate; }
    .play-line { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .45s ease-out .55s forwards; }
    .play-fill { opacity: 0; animation: fade .3s ease .95s forwards; }
    .word { opacity: 0; animation: rise .5s ease .75s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes eq { 0% { transform: scaleY(1); } 50% { transform: scaleY(.82); } 100% { transform: scaleY(.92); } }
    @media (prefers-reduced-motion: reduce) { .bar, .play-line, .play-fill, .word { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
  </style>
  <g class="mark"><defs><mask id="yw-cut-al"><rect x="-8" y="-8" width="80" height="80" fill="#fff"/><path d="M15 14L53 33L15 52Z" fill="#000" stroke="#000" stroke-width="9" stroke-linejoin="round"/></mask></defs><g mask="url(#yw-cut-al)"><g fill="#ff0033"><rect class="bar" style="animation-delay: 0.10s, 1.20s; animation-duration: .45s, 1.7s" x="4.0" y="22.0" width="6.4" height="22" rx="3.2"/><rect class="bar" style="animation-delay: 0.16s, 1.27s; animation-duration: .45s, 1.4s" x="13.0" y="13.0" width="6.4" height="40" rx="3.2"/><rect class="bar" style="animation-delay: 0.22s, 1.34s; animation-duration: .45s, 1.9s" x="22.0" y="18.0" width="6.4" height="30" rx="3.2"/><rect class="bar" style="animation-delay: 0.28s, 1.41s; animation-duration: .45s, 1.55s" x="31.0" y="5.0" width="6.4" height="56" rx="3.2"/><rect class="bar" style="animation-delay: 0.34s, 1.48s; animation-duration: .45s, 1.8s" x="40.0" y="15.0" width="6.4" height="36" rx="3.2"/><rect class="bar" style="animation-delay: 0.40s, 1.55s; animation-duration: .45s, 1.45s" x="49.0" y="10.0" width="6.4" height="46" rx="3.2"/><rect class="bar" style="animation-delay: 0.46s, 1.62s; animation-duration: .45s, 2.0s" x="58.0" y="24.0" width="6.4" height="18" rx="3.2"/></g></g><path class="play-fill" d="M15 14L53 33L15 52Z" fill="#111111"/><path class="play-line" pathLength="100" d="M15 14L53 33L15 52Z" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round"/></g>
